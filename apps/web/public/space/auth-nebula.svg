<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A distant blue planet in a quiet star field">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030b14"/>
      <stop offset="0.6" stop-color="#061522"/>
      <stop offset="1" stop-color="#092535"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.32" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#5ccfe9"/>
      <stop offset="0.28" stop-color="#2187ab"/>
      <stop offset="0.62" stop-color="#0d4465"/>
      <stop offset="1" stop-color="#04121f"/>
    </radialGradient>
    <radialGradient id="atmosphere" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#39d5f5" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#39d5f5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#39d5f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14779c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#061522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030b14" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#030b14" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#030b14" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="stars" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="44" r="1" fill="#c7effc" opacity="0.5"/>
      <circle cx="146" cy="96" r="0.8" fill="#9fe4f8" opacity="0.4"/>
      <circle cx="88" cy="168" r="1.2" fill="#7fe4ff" opacity="0.32"/>
      <circle cx="182" cy="188" r="0.7" fill="#f1f7fc" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="1400" fill="url(#bg)"/>
  <rect width="1200" height="1400" fill="url(#stars)"/>
  <ellipse cx="900" cy="1080" rx="620" ry="460" fill="url(#nebula)" filter="url(#blur60)"/>
  <ellipse cx="1120" cy="260" rx="360" ry="300" fill="url(#nebula)" filter="url(#blur60)" opacity="0.5"/>

  <circle cx="960" cy="1120" r="420" fill="url(#atmosphere)"/>
  <circle cx="960" cy="1120" r="340" fill="url(#planet)"/>
  <circle cx="960" cy="1120" r="341" fill="none" stroke="#8ef0ff" stroke-width="4" opacity="0.32" filter="url(#blur12)"/>
  <path d="M 700 880 A 340 340 0 0 1 710 1320" fill="none" stroke="#a6f2ff" stroke-width="7" opacity="0.4" filter="url(#blur12)"/>

  <g fill="#d9f5ff">
    <circle cx="220" cy="240" r="1.6" opacity="0.6"/>
    <circle cx="480" cy="520" r="1.4" opacity="0.5"/>
    <circle cx="160" cy="820" r="1.5" opacity="0.45"/>
    <circle cx="640" cy="180" r="1.3" opacity="0.4"/>
  </g>

  <rect width="1200" height="1400" fill="url(#veil)"/>
</svg>
